name: Deploy to GitHub Pages

on:
  push:
    branches: [horizon]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel queued runs when a newer one
# arrives so we never deploy a stale build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts skips the native `canvas` build, which is only
        # used by the in-browser Pyret runtime (the page user is the one
        # running it in a browser, not our Actions runner).
        run: npm ci --ignore-scripts

      - name: Link pyret-lang and build the web bundle
        # `link-pyret` creates the `pyret/` symlink into node_modules.
        # `web-local` chains through libpyret → phaseA → cpo-main → assets.
        run: |
          make link-pyret
          make web-local

      - name: Promote editor.embed.html to index.html
        # editor.embed.html is the standalone, pre-rendered entry point
        # (BASE_URL=".", embedded fetch server, etc.) — see .env.embed.
        # Pages serves this repo as a project page at
        # `https://jayret-lang.github.io/code/`, so its directory index
        # is the file at the root of build/web/.
        run: cp build/web/editor.embed.html build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build/web as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
